# Configuración exclusiva para las pruebas automatizadas.
# Usa H2 en memoria para que los tests corran sin necesidad de tener
# PostgreSQL instalado ni datos previos: cualquiera puede clonar y ejecutar.

spring.datasource.url=jdbc:h2:mem:huertohogar_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Clave de firma solo para pruebas.
app.jwt.secret=clave-de-pruebas-huertohogar-solo-para-tests-1234567890
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:5173
app.admin.email=admin@huertohogar.cl
app.frontend.url=http://localhost:5173

# spring.mail.host solo necesita existir para que Spring cree el bean
# JavaMailSender (si no, ni siquiera arranca el contexto). Apunta a un puerto
# local sin nada escuchando a propósito: el envío falla rápido con
# "Connection refused" y AuthService ya atrapa ese error (MailException) sin
# romper la petición, así los tests no dependen de la red ni de credenciales
# reales. No se usa @MockitoBean para JavaMailSender aquí a propósito: forzaría
# un ApplicationContext aparte que, al compartir la misma URL de H2 en memoria
# que el resto de los tests, borra sus tablas al cerrarse (create-drop).
spring.mail.host=localhost
spring.mail.port=1
app.mail.from=no-reply@huertohogar.cl

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
