# Configuración exclusiva para las pruebas automatizadas.
# Usa H2 en memoria para que los tests corran sin necesidad de tener
# PostgreSQL instalado ni datos previos: cualquiera puede clonar y ejecutar.

spring.datasource.url=jdbc:h2:mem:huertohogar_test;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop

# Clave de firma solo para pruebas.
app.jwt.secret=clave-de-pruebas-huertohogar-solo-para-tests-1234567890
app.jwt.expiration-ms=3600000

app.cors.allowed-origins=http://localhost:5173
app.admin.email=admin@huertohogar.cl
app.frontend.url=http://localhost:5173

# Vacía a propósito: EmailService omite el envío sin intentar ninguna
# llamada de red, así los tests no dependen de la red ni de credenciales reales.
app.mail.resend-api-key=
app.mail.from=no-reply@huertohogar.cl

spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB
