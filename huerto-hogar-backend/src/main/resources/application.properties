spring.application.name=huerto-hogar-backend

# --- Configuración de Conexión a MySQL ---
# Los valores sensibles se leen de variables de entorno; el valor tras ':' es
# solo el respaldo para desarrollo local. Nunca subir credenciales reales aquí.
spring.datasource.url=${DB_URL:jdbc:mysql://localhost:3307/huertohogar_db}
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:admin1234}

# --- Configuración de JPA (Hibernate) ---
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
# 'update' revisa las clases @Entity y crea o actualiza las tablas.
spring.jpa.hibernate.ddl-auto=update

# --- Seguridad: JWT ---
# Clave de firma HS256: mínimo 32 caracteres. En producción va por variable de
# entorno (JWT_SECRET); si alguien conoce esta clave puede falsificar tokens.
app.jwt.secret=${JWT_SECRET:cambiar-esta-clave-de-desarrollo-huertohogar-2025}
# Vigencia del token: 8 horas en milisegundos.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# --- Seguridad: CORS ---
# Orígenes autorizados a llamar la API, separados por coma. Nunca usar '*'.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Cuenta de administración ---
# El registro con este email obtiene rol ADMIN. Solo puede reclamarse una vez,
# porque el email es único en la tabla 'users'.
app.admin.email=${ADMIN_EMAIL:admin@huertohogar.cl}

# --- Subida de archivos ---
# Límite de tamaño para las imágenes de productos.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# Documentación de la API (Swagger UI)
# http://localhost:8080/swagger-ui/index.html
