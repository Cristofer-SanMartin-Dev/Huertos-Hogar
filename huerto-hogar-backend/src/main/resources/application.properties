spring.application.name=huerto-hogar-backend

# Render (y hosts similares) inyectan PORT y esperan que la app escuche ahí.
server.port=${PORT:8080}

# Carga huerto-hogar-backend/.env si existe (mismo formato KEY=VALUE que un
# .properties, por eso funciona sin ninguna librería extra). 'optional:' evita
# que falle el arranque cuando el archivo no existe (ej. en CI). Ver .env.example.
spring.config.import=optional:file:.env[.properties]

# --- Configuración de Conexión a PostgreSQL ---
# Los valores sensibles se leen de variables de entorno; el valor tras ':' es
# solo el respaldo para desarrollo local. Nunca subir credenciales reales aquí.
# 127.0.0.1 (no "localhost"): pg_hba.conf suele autenticar distinto IPv4 vs
# IPv6, y "localhost" puede resolver a ::1. DB_PASSWORD no tiene default: en
# instalaciones que sí piden contraseña para conectar, hay que ponerla en
# .env (ver .env.example).
spring.datasource.url=${DB_URL:jdbc:postgresql://127.0.0.1:5432/huertohogar_db}
spring.datasource.username=${DB_USERNAME:postgres}
spring.datasource.password=${DB_PASSWORD:}

# --- Configuración de JPA (Hibernate) ---
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
# 'update' revisa las clases @Entity y crea o actualiza las tablas.
spring.jpa.hibernate.ddl-auto=update

# --- Seguridad: JWT ---
# Clave de firma HS256: mínimo 32 caracteres. En producción va por variable de
# entorno (JWT_SECRET); si alguien conoce esta clave puede falsificar tokens.
app.jwt.secret=${JWT_SECRET:cambiar-esta-clave-de-desarrollo-huertohogar-2025}
# Vigencia del token: 8 horas en milisegundos.
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:28800000}

# --- Seguridad: CORS ---
# Orígenes autorizados a llamar la API, separados por coma. Nunca usar '*'.
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

# --- Cuenta de administración ---
# El registro con este email obtiene rol ADMIN. Solo puede reclamarse una vez,
# porque el email es único en la tabla 'users'.
app.admin.email=${ADMIN_EMAIL:admin@huertohogar.cl}

# --- Email: recuperación de contraseña y notificaciones de pedido (Brevo, API HTTP) ---
# Se usa la API HTTP de Brevo en vez de SMTP porque varios hosts free
# (incluido Render) bloquean las conexiones SMTP salientes. Sin
# BREVO_API_KEY el envío se omite (se registra en el log), pero la app
# arranca igual: el resto de la aplicación no depende del correo.
#
# A diferencia de Resend, el plan gratuito de Brevo no exige verificar un
# dominio propio: alcanza con verificar UNA dirección de remitente ("Single
# Sender" en brevo.com) para poder enviar a cualquier destinatario.
app.mail.brevo-api-key=${BREVO_API_KEY:}
# Debe ser la dirección que verificaste como Single Sender en Brevo.
app.mail.from=${MAIL_FROM:}
app.mail.from-name=${MAIL_FROM_NAME:HuertoHogar}

# URL del frontend, para construir el enlace que va dentro del correo.
app.frontend.url=${FRONTEND_URL:http://localhost:5173}

# --- Subida de archivos ---
# Límite de tamaño para las imágenes de producto que se suben a Cloudinary.
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=5MB

# --- Imágenes de producto (Cloudinary) ---
# Render (y la mayoría de los hosts free) no tiene disco persistente: un
# archivo guardado en el contenedor desaparece en el próximo reinicio, así
# que las imágenes se suben a Cloudinary en vez de al disco local. Formato
# de una sola variable que da el propio Cloudinary al crear la cuenta:
# cloudinary://<api_key>:<api_secret>@<cloud_name>
# Sin esto, subir una imagen se omite silenciosamente (se registra en el
# log) pero el producto igual se crea/actualiza.
app.cloudinary.url=${CLOUDINARY_URL:}

# Documentación de la API (Swagger UI)
# http://localhost:8080/swagger-ui/index.html
